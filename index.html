<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b72"><title>مولّد الأسئلة الذكي</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f4f7fb;color:#182230}.wrap{max-width:900px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#122f5d,#2876b9);color:#fff;padding:28px;border-radius:24px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;opacity:.92}.badge{display:inline-block;margin-top:14px;padding:6px 10px;background:#ffffff1f;border:1px solid #ffffff38;border-radius:99px;font-size:13px}.card,.q{background:#fff;border:1px solid #e1e7ef;border-radius:20px;padding:20px;box-shadow:0 8px 28px #172b4d0b}label{display:block;font-weight:750;margin:14px 0 7px}textarea,select,input{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:13px;font:inherit;background:#fff}textarea{min-height:170px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:13px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:18px;background:#1769aa;color:#fff;font-size:17px}.secondary{background:#eaf2fa;color:#174d7c}.btn:disabled{opacity:.55;cursor:not-allowed}.note,.meta{color:#66768b;font-size:13px;margin-top:10px}.result{margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.q{margin:12px 0;border-radius:16px}.q h3{margin:0 0 10px;font-size:18px}.choice{padding:10px 12px;background:#f5f7fa;border-radius:9px;margin:6px 0}.answer{margin-top:12px;color:#17633a;font-weight:800}.explain{color:#475569}.error,.success{padding:11px 13px;border-radius:10px;margin-top:12px}.error{background:#fff0ee;color:#a62a20}.success{background:#ecfdf3;color:#17633a}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:25px}}</style></head><body><main class="wrap"><section class="hero"><h1>مولّد الأسئلة الذكي</h1><p>حوّل الدروس والمحتوى إلى أسئلة دقيقة بالذكاء الاصطناعي.</p><span class="badge">مستقل عن موقع ذرات</span></section><section class="card"><label for="content">المحتوى أو الدرس</label><textarea id="content" maxlength="30000" placeholder="الصق نص الدرس هنا، أو اكتب الموضوع والمعلومات التي تريد إنشاء أسئلة منها..."></textarea><div class="meta"><span id="chars">0</span> / 30,000 حرف</div><div class="grid"><div><label for="type">نوع الأسئلة</label><select id="type"><option value="mixed">متنوعة</option><option value="mcq">اختيار من متعدد</option><option value="tf">صح أو خطأ</option><option value="short">إجابة قصيرة</option></select></div><div><label for="difficulty">مستوى الصعوبة</label><select id="difficulty"><option value="mixed">متدرج</option><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select></div><div><label for="count">عدد الأسئلة</label><input id="count" type="number" min="1" max="30" value="10"></div><div><label for="lang">اللغة</label><select id="lang"><option value="ar">العربية</option><option value="en">English</option></select></div></div><button class="btn primary" id="generate">إنشاء الأسئلة</button><div class="note">لا يتم تخزين مفتاح الذكاء الاصطناعي في جهازك أو داخل الصفحة.</div><div id="status"></div></section><section id="out" class="result" hidden><div class="toolbar"><button class="btn secondary" id="copy">نسخ الكل</button><button class="btn secondary" id="print">طباعة / حفظ PDF</button><button class="btn secondary" id="clear">مسح النتائج</button></div><div id="results"></div></section></main><script>const $=id=>document.getElementById(id);let latest=[];$('content').addEventListener('input',()=>{$('chars').textContent=$('content').value.length});$('generate').onclick=async()=>{const content=$('content').value.trim();if(!content)return msg('أدخل محتوى الدرس أولاً.','error');const n=Math.max(1,Math.min(30,+$('count').value||10));$('count').value=n;const b=$('generate');b.disabled=true;b.textContent='جارٍ إنشاء الأسئلة...';$('status').innerHTML='';$('out').hidden=true;try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,type:$('type').value,difficulty:$('difficulty').value,count:n,language:$('lang').value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'تعذر إنشاء الأسئلة.');latest=data.questions||[];if(!latest.length)throw new Error('لم يرجع المحرك أسئلة. حاول مرة أخرى.');render(latest);$('out').hidden=false;msg(`تم إنشاء ${latest.length} سؤال بنجاح.`,'success')}catch(e){msg(e.message||'حدث خطأ غير متوقع.','error')}finally{b.disabled=false;b.textContent='إنشاء الأسئلة'}};function msg(t,c){$('status').innerHTML=`<div class="${c}">${esc(t)}</div>`}function render(qs){$('results').innerHTML=qs.map((q,i)=>`<article class="q"><h3>${i+1}. ${esc(q.question||'')}</h3>${Array.isArray(q.choices)?q.choices.map(c=>`<div class="choice">${esc(c)}</div>`).join(''):''}<div class="answer">الإجابة: ${esc(q.answer||'')}</div>${q.explanation?`<p class="explain">التفسير: ${esc(q.explanation)}</p>`:''}</article>`).join('')}function plain(){return latest.map((q,i)=>`${i+1}. ${q.question}\n${(q.choices||[]).join('\n')}\nالإجابة: ${q.answer}${q.explanation?'\nالتفسير: '+q.explanation:''}`).join('\n\n')}$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(plain());msg('تم نسخ الأسئلة.','success')}catch{msg('تعذر النسخ التلقائي.','error')}};$('print').onclick=()=>window.print();$('clear').onclick=()=>{latest=[];$('results').innerHTML='';$('out').hidden=true;$('status').innerHTML=''};function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
