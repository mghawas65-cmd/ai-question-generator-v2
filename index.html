<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولّد الأسئلة الذكي</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f5f7fb;color:#182230}.wrap{max-width:820px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#173b72,#2563a9);color:white;padding:28px;border-radius:24px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;opacity:.9}.card{background:white;border:1px solid #e3e8ef;border-radius:20px;padding:20px;box-shadow:0 8px 30px #172b4d0d}label{display:block;font-weight:700;margin:15px 0 7px}textarea,select,input{width:100%;border:1px solid #ccd5e0;border-radius:12px;padding:13px;font:inherit;background:white}textarea{min-height:150px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;border:0;border-radius:14px;padding:15px;margin-top:20px;background:#1769aa;color:white;font-weight:800;font-size:17px;cursor:pointer}.btn:disabled{opacity:.55}.note{margin-top:12px;color:#65758b;font-size:14px}.result{margin-top:18px}.q{background:white;border:1px solid #e3e8ef;border-radius:16px;padding:17px;margin:12px 0}.q h3{margin:0 0 10px}.choice{padding:9px 12px;background:#f6f8fb;border-radius:9px;margin:6px 0}.answer{margin-top:10px;color:#17633a;font-weight:700}.error{color:#b42318;margin-top:12px}@media(max-width:600px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:25px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>مولّد الأسئلة الذكي</h1><p>أنشئ أسئلة تعليمية بالذكاء الاصطناعي مباشرة — بدون الاعتماد على موقع ذرات.</p></section>
<section class="card">
<label for="content">المحتوى أو الدرس</label><textarea id="content" placeholder="الصق نص الدرس هنا، أو اكتب الموضوع الذي تريد إنشاء أسئلة عنه..."></textarea>
<div class="grid">
<div><label for="type">نوع الأسئلة</label><select id="type"><option value="mixed">متنوعة</option><option value="mcq">اختيار من متعدد</option><option value="tf">صح أو خطأ</option><option value="short">إجابة قصيرة</option></select></div>
<div><label for="difficulty">مستوى الصعوبة</label><select id="difficulty"><option value="mixed">متدرج</option><option value="easy">سهل</option><option value="medium">متوسط</option><option value="hard">صعب</option></select></div>
<div><label for="count">عدد الأسئلة</label><input id="count" type="number" min="1" max="30" value="10"></div>
<div><label for="lang">اللغة</label><select id="lang"><option value="ar">العربية</option><option value="en">English</option></select></div>
</div>
<button class="btn" id="generate">إنشاء الأسئلة</button>
<div class="note">النسخة الحالية تجهّز الواجهة المستقلة. سيتم ربط محرك الذكاء الاصطناعي الآمن من الخادم في الخطوة التالية.</div><div id="status"></div>
</section><section id="results" class="result"></section>
</main>
<script>
const $=id=>document.getElementById(id);$('generate').onclick=async()=>{const content=$('content').value.trim();if(!content){$('status').innerHTML='<div class="error">أدخل محتوى الدرس أولاً.</div>';return}const btn=$('generate');btn.disabled=true;btn.textContent='جارٍ إنشاء الأسئلة...';$('status').textContent='';$('results').innerHTML='';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,type:$('type').value,difficulty:$('difficulty').value,count:+$('count').value,language:$('lang').value})});if(!r.ok)throw new Error('لم يتم تفعيل محرك الذكاء الاصطناعي بعد.');const data=await r.json();render(data.questions||[])}catch(e){$('status').innerHTML='<div class="error">'+e.message+'</div>'}finally{btn.disabled=false;btn.textContent='إنشاء الأسئلة'}};
function render(qs){$('results').innerHTML=qs.map((q,i)=>`<article class="q"><h3>${i+1}. ${esc(q.question||'')}</h3>${(q.choices||[]).map(c=>`<div class="choice">${esc(c)}</div>`).join('')}<div class="answer">الإجابة: ${esc(q.answer||'')}</div>${q.explanation?`<p>${esc(q.explanation)}</p>`:''}</article>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
